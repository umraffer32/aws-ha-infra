<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>HA AWS Infrastructure — Current Implementation (NAT Instances + Route Healer)</title>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="730" fill="#FFFFFF"/>

  <!-- ── Internet / Users ─────────────────────────────────────── -->
  <rect x="345" y="12" width="210" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="450" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Internet / Users</text>
  <line x1="450" y1="48" x2="450" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Internet Gateway ─────────────────────────────────────── -->
  <rect x="320" y="68" width="260" height="32" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="450" y="89" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Internet Gateway</text>
  <line x1="450" y1="100" x2="450" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── VPC container ────────────────────────────────────────── -->
  <rect x="20" y="114" width="860" height="504" rx="16" fill="#F8F7F2" stroke="#9B9A96" stroke-width="1"/>
  <text x="38" y="133" font-size="11" fill="#5F5E5A">VPC  10.0.0.0/16  ·  region: us-west-2</text>

  <!-- ══ AZ  us-west-2a ══════════════════════════════════════════ -->
  <rect x="36" y="142" width="390" height="294" rx="10" fill="#E8F4EE" stroke="#2D7D5A" stroke-width="0.75"/>
  <text x="54" y="160" font-size="12" font-weight="600" fill="#085041">us-west-2a</text>

  <!-- AZ-a · Public subnet -->
  <rect x="54" y="168" width="354" height="108" rx="7" fill="#EAF2FB" stroke="#1D6FAF" stroke-width="0.75"/>
  <text x="70" y="184" font-size="11" font-weight="500" fill="#0C447C">Public subnet  10.0.1.0/24</text>
  <!-- NAT instance -->
  <rect x="70" y="190" width="322" height="74" rx="5" fill="#FFFFFF" stroke="#1D6FAF" stroke-width="0.75"/>
  <rect x="70" y="190" width="36" height="14" rx="3" fill="#1D6FAF"/>
  <text x="88" y="201" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">ASG</text>
  <text x="231" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">NAT Instance</text>
  <text x="231" y="229" text-anchor="middle" font-size="10.5" fill="#1D6FAF">Debian 13  ·  t2.micro  ·  Packer AMI</text>
  <text x="231" y="247" text-anchor="middle" font-size="10.5" fill="#1D6FAF">source_dest_check=false  ·  iptables MASQUERADE</text>

  <!-- Route annotation between subnets (AZ-a) -->
  <text x="231" y="283" text-anchor="middle" font-size="9" fill="#5F5E5A">↑  0.0.0.0/0 → NAT ENI  (auto-healed on replace)</text>

  <!-- AZ-a · Private subnet -->
  <rect x="54" y="290" width="354" height="136" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="70" y="306" font-size="11" font-weight="500" fill="#3C3489">Private subnet  10.0.11.0/24</text>
  <!-- Private instance -->
  <rect x="70" y="312" width="322" height="104" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.75"/>
  <rect x="70" y="312" width="36" height="14" rx="3" fill="#534AB7"/>
  <text x="88" y="323" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">ASG</text>
  <text x="231" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Private Instance</text>
  <text x="231" y="351" text-anchor="middle" font-size="10.5" fill="#534AB7">Ubuntu 24.04  ·  t2.micro  ·  Packer AMI</text>
  <text x="231" y="369" text-anchor="middle" font-size="10.5" fill="#534AB7">No public IP  ·  egress via NAT instance</text>
  <text x="231" y="387" text-anchor="middle" font-size="10.5" fill="#534AB7">Access: SSM Session Manager only</text>

  <!-- ══ AZ  us-west-2b ══════════════════════════════════════════ -->
  <rect x="474" y="142" width="390" height="294" rx="10" fill="#E8F4EE" stroke="#2D7D5A" stroke-width="0.75"/>
  <text x="492" y="160" font-size="12" font-weight="600" fill="#085041">us-west-2b</text>

  <!-- AZ-b · Public subnet -->
  <rect x="492" y="168" width="354" height="108" rx="7" fill="#EAF2FB" stroke="#1D6FAF" stroke-width="0.75"/>
  <text x="508" y="184" font-size="11" font-weight="500" fill="#0C447C">Public subnet  10.0.2.0/24</text>
  <!-- NAT instance -->
  <rect x="508" y="190" width="322" height="74" rx="5" fill="#FFFFFF" stroke="#1D6FAF" stroke-width="0.75"/>
  <rect x="508" y="190" width="36" height="14" rx="3" fill="#1D6FAF"/>
  <text x="526" y="201" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">ASG</text>
  <text x="669" y="211" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">NAT Instance</text>
  <text x="669" y="229" text-anchor="middle" font-size="10.5" fill="#1D6FAF">Debian 13  ·  t2.micro  ·  Packer AMI</text>
  <text x="669" y="247" text-anchor="middle" font-size="10.5" fill="#1D6FAF">source_dest_check=false  ·  iptables MASQUERADE</text>

