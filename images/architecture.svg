  <rect x="492" y="290" width="354" height="136" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="508" y="306" font-size="11" font-weight="500" fill="#3C3489">Private subnet  10.0.12.0/24</text>
  <!-- Private instance -->
  <rect x="508" y="312" width="322" height="104" rx="5" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.75"/>
  <rect x="508" y="312" width="36" height="14" rx="3" fill="#534AB7"/>
  <text x="526" y="323" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">ASG</text>
  <text x="669" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Private Instance</text>
  <text x="669" y="351" text-anchor="middle" font-size="10.5" fill="#534AB7">Ubuntu 24.04  ·  t2.micro  ·  Packer AMI</text>
  <text x="669" y="369" text-anchor="middle" font-size="10.5" fill="#534AB7">No public IP  ·  egress via NAT instance</text>
  <text x="669" y="387" text-anchor="middle" font-size="10.5" fill="#534AB7">Access: SSM Session Manager only</text>

  <!-- ══ RDS Multi-AZ (spans both AZs) ════════════════════════════ -->
  <rect x="36" y="436" width="828" height="76" rx="8" fill="#E0F7F4" stroke="#1B7A6E" stroke-width="0.75"/>
  <text x="52" y="453" font-size="11" font-weight="600" fill="#0D4A40">RDS  ·  Multi-AZ PostgreSQL</text>

  <!-- Primary (aligned with AZ-a column) -->
  <rect x="52" y="459" width="374" height="44" rx="5" fill="#FFFFFF" stroke="#1B7A6E" stroke-width="0.75"/>
  <rect x="52" y="459" width="52" height="14" rx="3" fill="#1B7A6E"/>
  <text x="78" y="470" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">Primary</text>
  <text x="239" y="479" text-anchor="middle" font-size="11" font-weight="600" fill="#0D4A40">PostgreSQL 16  ·  db.t3.micro  ·  20 GiB gp2</text>
  <text x="239" y="494" text-anchor="middle" font-size="10" fill="#1B7A6E">us-west-2a  ·  encrypted  ·  port 5432</text>

  <!-- Standby (aligned with AZ-b column) -->
  <rect x="476" y="459" width="374" height="44" rx="5" fill="#FFFFFF" stroke="#1B7A6E" stroke-width="0.75"/>
  <rect x="476" y="459" width="54" height="14" rx="3" fill="#1B7A6E"/>
  <text x="503" y="470" text-anchor="middle" font-size="8" font-weight="700" fill="#FFFFFF">Standby</text>
  <text x="663" y="479" text-anchor="middle" font-size="11" font-weight="600" fill="#0D4A40">auto-failover  ·  synchronous replication</text>
  <text x="663" y="494" text-anchor="middle" font-size="10" fill="#1B7A6E">us-west-2b  ·  encrypted  ·  port 5432</text>

  <!-- ══ Route Healer strip (bottom of VPC) ══════════════════════ -->
  <rect x="36" y="540" width="828" height="66" rx="8" fill="#FEF3E2" stroke="#D97706" stroke-width="1"/>
  <text x="52" y="557" font-size="11" font-weight="700" fill="#92400E">Route Healer — auto-repairs private route tables when a NAT instance is replaced and receives a new ENI</text>

  <rect x="52" y="564" width="126" height="30" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="0.75"/>
  <text x="115" y="583" text-anchor="middle" font-size="10.5" font-weight="500" fill="#78350F">ASG Launch Event</text>

  <line x1="178" y1="579" x2="194" y2="579" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="194" y="564" width="126" height="30" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="0.75"/>
  <text x="257" y="583" text-anchor="middle" font-size="10.5" font-weight="500" fill="#78350F">EventBridge Rule</text>

  <line x1="320" y1="579" x2="336" y2="579" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="336" y="564" width="126" height="30" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="0.75"/>
  <text x="399" y="583" text-anchor="middle" font-size="10.5" font-weight="500" fill="#78350F">Lambda (Python)</text>

  <line x1="462" y1="579" x2="478" y2="579" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="478" y="564" width="126" height="30" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="0.75"/>
  <text x="541" y="583" text-anchor="middle" font-size="10.5" font-weight="500" fill="#78350F">ec2:ReplaceRoute</text>

  <line x1="604" y1="579" x2="620" y2="579" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="620" y="564" width="230" height="30" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="0.75"/>
  <text x="735" y="583" text-anchor="middle" font-size="10.5" font-weight="500" fill="#78350F">Private route table updated ✓</text>

  <!-- ── Monitoring strip (below VPC) ─────────────────────────── -->
  <rect x="20" y="632" width="860" height="80" rx="12" fill="#F1EFE8" stroke="#9B9A96" stroke-width="0.75"/>
