  <text x="137" y="673" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">CloudTrail</text>
  <text x="137" y="690" text-anchor="middle" font-size="10" fill="#5F5E5A">S3 bucket · CloudWatch Logs</text>

  <rect x="246" y="656" width="194" height="44" rx="6" fill="#FFFFFF" stroke="#9B9A96" stroke-width="0.75"/>
  <text x="343" y="673" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">CloudWatch Logs</text>
  <text x="343" y="690" text-anchor="middle" font-size="10" fill="#5F5E5A">1-day log retention</text>

  <rect x="452" y="656" width="194" height="44" rx="6" fill="#FFFFFF" stroke="#9B9A96" stroke-width="0.75"/>
  <text x="549" y="673" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">CW Alarms</text>
  <text x="549" y="690" text-anchor="middle" font-size="10" fill="#5F5E5A">Lambda errors · ingestion stall</text>

  <rect x="658" y="656" width="202" height="44" rx="6" fill="#FFFFFF" stroke="#9B9A96" stroke-width="0.75"/>
  <text x="759" y="673" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">Ops Dashboard</text>
  <text x="759" y="690" text-anchor="middle" font-size="10" fill="#5F5E5A">CloudWatch operations view</text>

</svg>
